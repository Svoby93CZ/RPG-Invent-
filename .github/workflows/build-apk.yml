# Builds an installable debug APK on GitHub's machines, so a phone (or any browser) is enough
# to get a testable build — no Android SDK, no laptop.
#
# Where to find the result:
#   * repository -> Releases -> "Debug APK" -> tap the .apk to install it straight on a phone
#   * repository -> Actions -> this run -> Artifacts (a .zip, handy on a desktop)
name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Needed to publish the rolling debug release.
permissions:
  contents: write

concurrency:
  # A newer push makes an in-flight build pointless.
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image normally has these accepted already; this is only a safety net, so it
      # must never fail the build.
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          # A name that says which commit it came from, for the downloadable artifact.
          branch="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/rpg-invent-${branch}-${GITHUB_SHA::7}.apk"
          # A stable name for the release asset, so the phone always has the same link.
          cp app/build/outputs/apk/debug/app-debug.apk dist/rpg-invent-debug.apk
          echo "artifact=dist/rpg-invent-${branch}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.collect.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      # One release that is overwritten every build, so the download link never changes.
      - name: Publish to the rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Větev \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA::7}\`, sestaveno $(date -u '+%Y-%m-%d %H:%M UTC')."
          if gh release view debug > /dev/null 2>&1; then
            gh release upload debug dist/rpg-invent-debug.apk --clobber
            gh release edit debug --notes "$notes"
          else
            gh release create debug \
              --prerelease \
              --title "Debug APK" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              dist/rpg-invent-debug.apk
          fi

  test:
    name: Unit testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
